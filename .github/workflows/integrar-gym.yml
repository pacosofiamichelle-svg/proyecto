name: Integrar GOFIT desde gym

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proyecto
        uses: actions/checkout@v4
        with:
          path: proyecto

      - name: Checkout gym
        uses: actions/checkout@v4
        with:
          repository: pacosofiamichelle-svg/gym
          ref: main
          path: gym
          persist-credentials: false

      - name: Copiar archivos de GOFIT
        run: |
          cp gym/index.html proyecto/index.html
          cp gym/script.js proyecto/script.js
          cp gym/style.css proyecto/style.css
          cp gym/"WhatsApp Image 2026-08-20 at 2.07.39 PM.jpeg" proyecto/"WhatsApp Image 2026-08-20 at 2.07.39 PM.jpeg"

      - name: Guardar cambios en proyecto
        working-directory: proyecto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html script.js style.css "WhatsApp Image 2026-08-20 at 2.07.39 PM.jpeg"
          git diff --cached --quiet || git commit -m "Integrar GOFIT desde gym"
          git push